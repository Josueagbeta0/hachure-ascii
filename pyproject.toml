[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "hachure"
dynamic = ["version"]
description = "Rend images, vidéos, caméras et art 3D procédural en ASCII dans un terminal"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE*"]
keywords = ["ascii-art", "terminal", "video", "camera", "graphics", "ansi", "truecolor", "tui"]

authors = [
    { name = "Josué AGBETA" },
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Video",
    "Natural Language :: French",
]

dependencies = [
    "numpy>=1.24",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/Josueagbeta0/hachure-ascii"
Repository = "https://github.com/Josueagbeta0/hachure-ascii"
Issues = "https://github.com/Josueagbeta0/hachure-ascii/issues"

[project.scripts]
hachure = "hachure.cli:main"

[tool.setuptools.packages.find]
include = ["hachure*"]

[tool.setuptools.dynamic]
version = { attr = "hachure.__version__" }
